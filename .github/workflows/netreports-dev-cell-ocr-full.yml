name: Net Reports Cell OCR v2 Full Archive (dev only)

on:
  push:
    branches:
      - feature/netreports-dev-cell-ocr-v2
    paths:
      - "netreports-dev/scripts/import_cells_all.py"
      - "netreports-dev/tests/test_import_cells_all.py"
      - ".github/workflows/netreports-dev-cell-ocr-full.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netreports-dev-cell-ocr-v2-full
  cancel-in-progress: true

jobs:
  full-import:
    if: github.ref == 'refs/heads/feature/netreports-dev-cell-ocr-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/netreports-dev-cell-ocr-v2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR tools
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            # Runner apt indices are already present. A global apt update has
            # intermittently stalled on Ubuntu mirrors, so install directly.
            timeout 180 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tesseract-ocr
          fi
          python -m pip install --disable-pip-version-check pillow pytesseract numpy opencv-python-headless
      - name: Run regression tests
        run: python -m unittest discover -s netreports-dev/tests -v
      - name: Extract entire historical screenshot archive
        run: |
          python -u netreports-dev/scripts/import_cells_all.py --root .
      - name: Verify archive coverage and held-out reference performance
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          dataset=json.loads(Path('netreports-dev/data/cell-ocr-archive.json').read_text())
          audit=json.loads(Path('netreports-dev/data/cell-ocr-audit.json').read_text())
          expected={p.name[4:14] for p in Path('assets/img').glob('net-????-??-??.png')
                    if re.fullmatch(r'net-\d{4}-\d{2}-\d{2}\.png',p.name)}
          assert len(expected) >= 162
          assert {n['date'] for n in dataset['nets']} == expected
          assert audit['matched_reference_rows'] == 38
          # A regression guard, not a substitute for independent validation.
          assert audit['reference_callsign_matches'] >= 35
          assert audit['nets_with_zero_rows'] == []
          assert all(not r['reviewed'] for r in dataset['checkins'])
          print('Images:', len(expected), 'candidate check-ins:',len(dataset['checkins']))
          print('Reference callsigns:',audit['reference_callsign_matches'],'/',audit['matched_reference_rows'])
          print('Review-flagged entries:',audit['review_needed_rows'])
          PY
      - name: Commit experimental dataset only to development PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netreports-dev/data/cell-ocr-archive.json netreports-dev/data/cell-ocr-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate experimental full archive with cell OCR v2"
            git pull --rebase origin feature/netreports-dev-cell-ocr-v2
            git push origin HEAD:feature/netreports-dev-cell-ocr-v2
          fi
