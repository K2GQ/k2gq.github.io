name: Net Reports Development OCR (sample only)

on:
  push:
    branches:
      - feature/netreports-dev-poc
    paths:
      - netreports-dev/index.html
      - netreports-dev/data/reviewed.json
      - netreports-dev/scripts/**
      - .github/workflows/netreports-dev-ocr.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netreports-dev-poc-ocr
  cancel-in-progress: true

jobs:
  sample-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --disable-pip-version-check pillow pytesseract
      - name: Extract four sample dates in one OCR pass
        run: |
          python netreports-dev/scripts/extract.py --root .
      - name: Validate JSON format
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("netreports-dev/data/preview.json").read_text())
          assert len(p["nets"]) == 4
          assert p["sample_only"] and not p["reviewed"]
          assert all(r["date"] in {n["date"] for n in p["nets"]} for r in p["checkins"])
          print("Net sample dates:", [n["date"] for n in p["nets"]])
          print("Unreviewed candidate OCR rows:", len(p["checkins"]))
          PY
      - name: Check development JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path("netreports-dev/index.html").read_text(encoding="utf-8")
          script = re.search(r"<script>(.*?)</script>", page, re.S)
          assert script, "Expected standalone page script"
          Path("/tmp/netreports-dev.js").write_text(script.group(1), encoding="utf-8")
          PY
          node --check /tmp/netreports-dev.js
      - name: Verify reviewed samples
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          p = json.loads(Path("netreports-dev/data/preview.json").read_text())
          reviewed = json.loads(Path("netreports-dev/data/reviewed.json").read_text())
          assert len(reviewed["rows"]) == 38
          assert p["reviewed_rows"] == 38
          counts = defaultdict(set)
          for row in p["checkins"]:
              if row["reviewed"]:
                  assert row["review_status"] == "Reviewed from image"
                  counts[row["date"]].add(row["callsign"])
          assert {d:len(calls) for d,calls in counts.items()} == {
              "2023-09-06":6, "2024-08-20":11, "2025-06-10":8, "2026-10-20":13
          }
          print("Reviewed sample participation counts:", {d: len(c) for d,c in counts.items()})
          PY
      - name: Commit sample development JSON and OCR diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netreports-dev/data/preview.json netreports-dev/data/ocr-review.txt
          if ! git diff --cached --quiet; then
            git commit -m "Generate provisional netreports-dev OCR sample data"
            git push origin HEAD:feature/netreports-dev-poc
          fi
