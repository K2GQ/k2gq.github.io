name: NetLogger Check-in Database Update

on:
  push:
    branches:
      - master
    paths:
      - '_netlogger-checkins/**'
      - 'netreports-dev/data/manual-checkins.csv'
      - 'netreports-dev/scripts/build_netlogger.py'
      - 'netreports-dev/tests/test_netlogger.py'
      - '.github/workflows/netlogger-native.yml'
  pull_request:
    paths:
      - '_netlogger-checkins/**'
      - 'netreports-dev/**'
      - '.github/workflows/netlogger-native.yml'
  workflow_dispatch:
    inputs:
      allow_history_reduction:
        description: 'Approve intentional loss or correction of previously published historical records'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: netlogger-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test NetLogger parsing and privacy controls
        run: python -m unittest discover -s netreports-dev/tests -p 'test_netlogger*.py' -v
      - name: Rebuild native records in a temporary location
        run: |
          python netreports-dev/scripts/build_netlogger.py --root . \
            --out /tmp/netlogger-verified.json --audit /tmp/netlogger-audit-verified.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/netlogger-verified.json').read_text())
          audit=json.loads(Path('/tmp/netlogger-audit-verified.json').read_text())
          assert data['kind'] == 'netlogger-native-checkins'
          assert data['batch_status'] == 'Uploads complete; gap review in progress'
          assert len(data['nets']) > 0
          assert len(data['checkins']) == audit['checkin_count']
          assert all(r['date'] in {n['date'] for n in data['nets']} for r in data['checkins'])
          assert not any(key in r for r in data['checkins'] for key in (
              'address','zip','zipcode','frn','email','phone','postal_address','street'))
          print('NetLogger native nets:', len(data['nets']))
          print('Source records:', len(data['checkins']))
          print('Quarantined files:',len(audit['quarantined_exports']))
          PY
      - name: Validate development page script and retired pipeline removal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page=Path('netreports-dev/index.html').read_text()
          script=re.search(r'<script>(.*?)</script>',page,re.S)
          assert script, "Development page script missing"
          Path('/tmp/netlogger-dev-page.js').write_text(script.group(1))
          assert 'data/netlogger.json' in page
          assert 'preview.json' not in page
          assert 'cell-ocr' not in page
          assert 'exportCSV' not in page
          retired=[
              'netreports-dev/scripts/extract.py',
              'netreports-dev/scripts/extract_cells.py',
              'netreports-dev/scripts/import_all.py',
              'netreports-dev/scripts/import_cells_all.py',
              'netreports-dev/scripts/view-data.js',
              'netreports-dev/data/preview.json',
              'netreports-dev/data/cell-ocr-archive.json',
              '.github/workflows/netreports-dev-ocr.yml',
              '.github/workflows/netreports-dev-cell-ocr-full.yml',
          ]
          assert not any(Path(p).exists() for p in retired), "Retired extraction files remain"
          PY
          node --check /tmp/netlogger-dev-page.js
          node netreports-dev/tests/test_dashboard.js
      - name: Verify committed outputs match the rebuilt dataset
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('netlogger.json', 'netlogger-audit.json'):
              saved=json.loads(Path('netreports-dev/data',name).read_text())
              rebuilt=json.loads(Path('/tmp',name.replace('.json','-verified.json')).read_text())
              assert saved == rebuilt, name + ' differs from import results'
              print('Matches rebuilt data:',name)
          PY

  publish-native:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out the published branch
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh, validate, and publish with bounded race retries
        env:
          ALLOW_HISTORY_REDUCTION: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_history_reduction == true && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild from each newly fetched master, never rebase stale JSON.
          # A concurrent human commit may make a first push non-fast-forward.
          for attempt in 1 2 3; do
            echo "Publication attempt $attempt of 3"
            git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
            git reset --hard refs/remotes/origin/master
            python -m unittest discover -s netreports-dev/tests -p 'test_netlogger*.py' -v
            cp netreports-dev/data/netlogger.json /tmp/netlogger-before.json
            python netreports-dev/scripts/build_netlogger.py --root .
            validation=(
              --baseline /tmp/netlogger-before.json
              --updated netreports-dev/data/netlogger.json
              --audit netreports-dev/data/netlogger-audit.json
            )
            if [[ "$ALLOW_HISTORY_REDUCTION" == "true" ]]; then
              validation+=(--allow-history-reduction)
            fi
            python netreports-dev/scripts/validate_netlogger_publication.py "${validation[@]}"
            git add netreports-dev/data/netlogger.json netreports-dev/data/netlogger-audit.json
            if git diff --cached --quiet; then
              echo "Published database already matches the latest sources."
              exit 0
            fi
            git commit -m "Update NetLogger check-ins from uploaded logs"
            if git push origin HEAD:master; then
              echo "Database pushed successfully."
              exit 0
            fi
            echo "Push rejected; fetching current master and rebuilding."
            sleep "$((attempt * 2))"
          done
          echo "ERROR: publication failed after three attempts" >&2
          exit 1
      - name: Request Pages rebuild, including unchanged reruns
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          # A GITHUB_TOKEN push does not trigger a branch-based Pages build.
          # Always request a build: this also recovers a previously failed one.
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPOSITORY/pages/builds"
