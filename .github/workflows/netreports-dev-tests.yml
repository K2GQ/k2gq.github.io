name: Net Reports Development Regression Tests

on:
  pull_request:
    paths:
      - "netreports-dev/scripts/**"
      - "netreports-dev/tests/**"
      - ".github/workflows/netreports-dev-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pillow pytesseract numpy opencv-python-headless
      - name: Test partial and full reviewed-data extraction
        run: python -m unittest discover -s netreports-dev/tests -v
