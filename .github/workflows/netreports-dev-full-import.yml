name: Net Reports Development Full Archive Import

on:
  push:
    branches:
      - feature/netreports-dev-full-archive
    paths:
      - "netreports-dev/scripts/**"
      - "netreports-dev/tests/**"
      - "netreports-dev/data/reviewed.json"
      - ".github/workflows/netreports-dev-full-import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netreports-dev-full-archive
  cancel-in-progress: true

jobs:
  full-import:
    if: github.ref == 'refs/heads/feature/netreports-dev-full-archive'
    name: Import historical net screenshots (development only)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: feature/netreports-dev-full-archive
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --disable-pip-version-check pillow pytesseract
      - name: Run extraction and batching unit tests
        run: |
          python -m unittest discover -s netreports-dev/tests -v
      - name: OCR every dated net screenshot
        run: |
          python -u netreports-dev/scripts/import_all.py --root . --batch-size 4
      - name: Check imported archive coverage and verified reference logs
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          images = sorted(p.name for p in Path("assets/img").glob("net-????-??-??.png")
                          if re.fullmatch(r"net-\d{4}-\d{2}-\d{2}\.png", p.name))
          dataset = json.loads(Path("netreports-dev/data/preview.json").read_text())
          audit = json.loads(Path("netreports-dev/data/import-audit.json").read_text())
          actual = {n["date"] for n in dataset["nets"]}
          expected = {p[4:14] for p in images}
          assert actual == expected, f"Missing net dates: {expected - actual}"
          assert len(dataset["nets"]) == len(expected)
          assert dataset["reviewed_rows"] == 38
          assert audit["source_image_count"] == len(expected)
          assert audit["imported_net_count"] == len(expected)
          assert audit["reviewed_nets"] == 4
          assert all(r["date"] in actual for r in dataset["checkins"])
          print(f"All {len(expected)} source images represented; {len(dataset['checkins'])} OCR/imported rows.")
          print(f"{audit['nets_flagged_for_review']} nets need verification.")
          if audit["nets_with_no_recognized_rows"]:
            print("Zero-row OCR dates:", audit["nets_with_no_recognized_rows"])
          PY
      - name: Commit provisional data to development PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netreports-dev/data/preview.json netreports-dev/data/import-audit.json netreports-dev/data/ocr-review.txt
          if ! git diff --cached --quiet; then
            git commit -m "Generate provisional OCR dataset for full net report archive"
            git push origin HEAD:feature/netreports-dev-full-archive
          fi
